[project]
name = "llm-agent-learning"
version = "0.1.0"
description = "An experimental lab and tutorial codebase exploring core LLM agent architectures, memory systems, and tool use."
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real Anthropic API (run with: pytest -m integration)",
]
